<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 136" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#0a0e14" />
    </linearGradient>

    <!-- Subtle accent line on top border -->
    <linearGradient id="topLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.7" />
      <stop offset="80%" stop-color="#34d399" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .mono {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    }
  </style>

  <!-- Clean card with hairline border -->
  <rect x="1" y="1" width="798" height="134" rx="8" fill="url(#cardBg)" stroke="#21262d" stroke-width="1" />
  
  <!-- Subtle top accent line -->
  <rect x="1" y="1" width="798" height="2" rx="1" fill="url(#topLine)" />

  <!-- Left Content -->
  <g transform="translate(36, 38)">
    <text class="mono" x="0" y="0" font-size="11" font-weight="500" fill="#8b949e" letter-spacing="1.5">
      ARNAV SHARMA
    </text>

    <text class="sans" x="0" y="30" font-size="22" font-weight="600" fill="#f0f6fc" letter-spacing="-0.3">
      Building applied AI systems and web products.
    </text>

    <text class="sans" x="0" y="54" font-size="13" font-weight="400" fill="#8b949e">
      Undergraduate at CHRIST University, Pune · Real-time software &amp; autonomous workflows
    </text>
  </g>

  <!-- Right Meta -->
  <g class="mono" transform="translate(630, 38)">
    <text x="0" y="0" font-size="11" fill="#8b949e" letter-spacing="0.5">
      Pune, India
    </text>
    <text x="0" y="22" font-size="11" fill="#484f58">
      UTC +05:30
    </text>
  </g>
</svg>
