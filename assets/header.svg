<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#0a0e14" />
    </linearGradient>

    <!-- Subtle accent line on top border -->
    <linearGradient id="topLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.7" />
      <stop offset="80%" stop-color="#34d399" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    }
  </style>

  <!-- Clean card with soft border -->
  <rect x="1" y="1" width="798" height="148" rx="8" fill="url(#cardBg)" stroke="#21262d" stroke-width="1" />
  
  <!-- Sleek hairline highlight on top -->
  <rect x="1" y="1" width="798" height="2" rx="1" fill="url(#topLine)" />

  <!-- Left Content -->
  <g transform="translate(36, 42)">
    <!-- Small quiet eyebrow -->
    <text class="font-mono" x="0" y="0" font-size="11" font-weight="500" fill="#8b949e" letter-spacing="1.5">
      ARNAV SHARMA
    </text>

    <!-- Clean, bold headline -->
    <text class="font-sans" x="0" y="32" font-size="24" font-weight="700" fill="#f0f6fc" letter-spacing="-0.4">
      Building applied AI systems and web products.
    </text>

    <!-- Understated subline -->
    <text class="font-sans" x="0" y="58" font-size="13.5" font-weight="400" fill="#8b949e">
      Undergraduate at CHRIST University, Pune · Focused on AI systems, full-stack architecture, and craft.
    </text>
  </g>

  <!-- Right Meta -->
  <g class="font-mono" transform="translate(630, 42)">
    <text x="0" y="0" font-size="11" fill="#8b949e" letter-spacing="0.5">
      Pune, India
    </text>
    <text x="0" y="24" font-size="11" fill="#484f58">
      UTC +05:30
    </text>
  </g>
</svg>
