<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="100%">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Border highlight gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#1e293b" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#06b6d4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.3" />
    </linearGradient>

    <!-- Text gradient for main name -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Cyan to emerald accent gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glow filter for status beacon and logo -->
    <filter id="beaconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle grid pattern -->
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.45" />
      <circle cx="30" cy="0" r="1" fill="#334155" fill-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    .font-mono {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    }
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    /* Beacon pulse animation */
    @keyframes pulseGlow {
      0%, 100% {
        opacity: 0.95;
        r: 4.5;
      }
      50% {
        opacity: 0.35;
        r: 6.5;
      }
    }

    /* Ambient scanline / grid sheen */
    @keyframes sheenSweep {
      0% {
        opacity: 0.05;
        transform: translateY(-50px);
      }
      50% {
        opacity: 0.12;
      }
      100% {
        opacity: 0.05;
        transform: translateY(260px);
      }
    }

    /* Staggered text fade in */
    @keyframes elementReveal {
      0% {
        opacity: 0;
        transform: translateY(6px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .pulse-beacon {
      animation: pulseGlow 2.4s ease-in-out infinite;
    }

    .revealed {
      animation: elementReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @media (prefers-reduced-motion: reduce) {
      .pulse-beacon, .revealed {
        animation: none !important;
      }
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="246" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Dotted Grid Overlay -->
  <rect x="2" y="2" width="846" height="246" rx="14" fill="url(#gridPattern)" />

  <!-- Corner Brackets (Cyber-Tactile Engineering HUD) -->
  <path d="M 18 28 L 18 18 L 28 18" stroke="#10b981" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 832 28 L 832 18 L 822 18" stroke="#10b981" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 18 222 L 18 232 L 28 232" stroke="#06b6d4" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 832 222 L 832 232 L 822 232" stroke="#06b6d4" stroke-width="2" fill="none" opacity="0.8" />

  <!-- TOP TELEMETRY STRIP -->
  <!-- Node / Coordinate ID -->
  <g class="font-mono">
    <text x="36" y="42" font-size="11" fill="#64748b" letter-spacing="1.2">
      <tspan fill="#10b981">//</tspan> SYS.NODE <tspan fill="#94a3b8">18.52° N, 73.85° E</tspan> [PUNE_IN]
    </text>

    <!-- Live Status Beacon -->
    <g transform="translate(640, 32)">
      <!-- Beacon background capsule -->
      <rect x="0" y="0" width="174" height="22" rx="11" fill="#031f18" stroke="#059669" stroke-width="1" />
      <circle cx="16" cy="11" r="4.5" fill="#10b981" filter="url(#beaconGlow)" class="pulse-beacon" />
      <text x="28" y="15" font-size="10.5" fill="#34d399" font-weight="600" letter-spacing="0.8">STATUS: ACTIVE // DEV</text>
    </g>
  </g>

  <!-- Horizontal Divider Line -->
  <line x1="36" y1="62" x2="814" y2="62" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 3" />

  <!-- CENTER CORE IDENTITY -->
  <g transform="translate(42, 90)">
    <!-- Architectural Monogram Hex -->
    <g transform="translate(0, 0)">
      <polygon points="32,2 62,18 62,54 32,70 2,54 2,18" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="1.8" />
      <polygon points="32,10 54,23 54,49 32,62 10,49 10,23" fill="#030712" stroke="#1e293b" stroke-width="1" />
      <!-- Stylized A mark -->
      <path d="M 23 48 L 32 24 L 41 48 M 26 41 L 38 41" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <circle cx="32" cy="18" r="2" fill="#10b981" filter="url(#beaconGlow)" />
    </g>

    <!-- Name & Typography -->
    <g transform="translate(85, 0)">
      <text x="0" y="32" class="font-sans" font-size="34" font-weight="800" fill="url(#textGrad)" letter-spacing="-1.2">
        ARNAV SHARMA
      </text>

      <text x="345" y="30" class="font-mono" font-size="13" font-weight="500" fill="#38bdf8" letter-spacing="0.5">
        @arnav-honeyyyeater
      </text>

      <!-- Mission / Subtitle -->
      <text x="0" y="58" class="font-sans" font-size="14.5" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
        Applied AI Systems Architecture <tspan fill="#334155">·</tspan> High-Craft Web Engineering <tspan fill="#334155">·</tspan> Real-time Software
      </text>
    </g>
  </g>

  <!-- BOTTOM TELEMETRY BAR -->
  <g transform="translate(36, 192)">
    <rect x="0" y="0" width="778" height="34" rx="7" fill="#030712" fill-opacity="0.8" stroke="#1e293b" stroke-width="1" />
    
    <!-- Segment 1: Education -->
    <g class="font-mono" transform="translate(18, 22)">
      <circle cx="0" cy="-4" r="2.5" fill="#10b981" />
      <text x="10" y="0" font-size="11" fill="#cbd5e1" font-weight="500">CHRIST University <tspan fill="#64748b">/ CS &amp; Data Science</tspan></text>
    </g>

    <!-- Divider -->
    <line x1="280" y1="8" x2="280" y2="26" stroke="#1e293b" stroke-width="1" />

    <!-- Segment 2: Specialization -->
    <g class="font-mono" transform="translate(298, 22)">
      <circle cx="0" cy="-4" r="2.5" fill="#38bdf8" />
      <text x="10" y="0" font-size="11" fill="#cbd5e1" font-weight="500">Stack: <tspan fill="#94a3b8">Next.js · TypeScript · Supabase · Python</tspan></text>
    </g>

    <!-- Divider -->
    <line x1="620" y1="8" x2="620" y2="26" stroke="#1e293b" stroke-width="1" />

    <!-- Segment 3: Timezone -->
    <g class="font-mono" transform="translate(638, 22)">
      <circle cx="0" cy="-4" r="2.5" fill="#a855f7" />
      <text x="10" y="0" font-size="11" fill="#cbd5e1" font-weight="500">UTC+5:30 <tspan fill="#64748b">[IST Node]</tspan></text>
    </g>
  </g>
</svg>
