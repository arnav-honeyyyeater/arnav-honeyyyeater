<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 210" width="100%" height="100%">
  <defs>
    <linearGradient id="matrixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#080d1a" />
    </linearGradient>
  </defs>

  <style>
    .mono {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
    .badge {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 11px;
      font-weight: 500;
    }
  </style>

  <!-- Base Container -->
  <rect x="2" y="2" width="846" height="206" rx="12" fill="url(#matrixBg)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Title Bar -->
  <g transform="translate(24, 28)">
    <text class="mono" x="0" y="0" font-size="11" fill="#10b981" font-weight="600" letter-spacing="1.2">
      // SYSTEM_CAPABILITIES_MATRIX
    </text>
    <text class="mono" x="790" y="0" font-size="10" fill="#64748b" text-anchor="end">
      STABLE_RUNTIME // 2026.11
    </text>
    <line x1="0" y1="12" x2="798" y2="12" stroke="#1e293b" stroke-width="1" />
  </g>

  <!-- 4 Quadrants -->
  <!-- Quadrant 1: Systems & Core -->
  <g transform="translate(24, 52)">
    <rect x="0" y="0" width="390" height="66" rx="8" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
    <circle cx="16" cy="18" r="3" fill="#38bdf8" />
    <text class="mono" x="26" y="21" font-size="10.5" fill="#38bdf8" font-weight="600" letter-spacing="0.5">SYSTEMS &amp; LANGUAGES</text>
    <g transform="translate(16, 46)">
      <text class="badge" fill="#e2e8f0">
        <tspan fill="#38bdf8">■</tspan> TypeScript <tspan fill="#475569">·</tspan>
        <tspan fill="#facc15">■</tspan> JavaScript <tspan fill="#475569">·</tspan>
        <tspan fill="#60a5fa">■</tspan> Python <tspan fill="#475569">·</tspan>
        <tspan fill="#34d399">■</tspan> SQL (Postgres)
      </text>
    </g>
  </g>

  <!-- Quadrant 2: Frontend & Interface -->
  <g transform="translate(434, 52)">
    <rect x="0" y="0" width="390" height="66" rx="8" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
    <circle cx="16" cy="18" r="3" fill="#10b981" />
    <text class="mono" x="26" y="21" font-size="10.5" fill="#10b981" font-weight="600" letter-spacing="0.5">FRONTEND &amp; INTERACTION</text>
    <g transform="translate(16, 46)">
      <text class="badge" fill="#e2e8f0">
        <tspan fill="#f8fafc">■</tspan> Next.js 15 <tspan fill="#475569">·</tspan>
        <tspan fill="#38bdf8">■</tspan> React <tspan fill="#475569">·</tspan>
        <tspan fill="#2dd4bf">■</tspan> Tailwind CSS <tspan fill="#475569">·</tspan>
        <tspan fill="#fb7185">■</tspan> Motion
      </text>
    </g>
  </g>

  <!-- Quadrant 3: Backend & Data -->
  <g transform="translate(24, 126)">
    <rect x="0" y="0" width="390" height="66" rx="8" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
    <circle cx="16" cy="18" r="3" fill="#a855f7" />
    <text class="mono" x="26" y="21" font-size="10.5" fill="#a855f7" font-weight="600" letter-spacing="0.5">BACKEND &amp; DATA INFRASTRUCTURE</text>
    <g transform="translate(16, 46)">
      <text class="badge" fill="#e2e8f0">
        <tspan fill="#34d399">■</tspan> Supabase <tspan fill="#475569">·</tspan>
        <tspan fill="#818cf8">■</tspan> Postgres RLS <tspan fill="#475569">·</tspan>
        <tspan fill="#4ade80">■</tspan> Node.js <tspan fill="#475569">·</tspan>
        <tspan fill="#f97316">■</tspan> WebSockets
      </text>
    </g>
  </g>

  <!-- Quadrant 4: AI & Applied Systems -->
  <g transform="translate(434, 126)">
    <rect x="0" y="0" width="390" height="66" rx="8" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
    <circle cx="16" cy="18" r="3" fill="#f59e0b" />
    <text class="mono" x="26" y="21" font-size="10.5" fill="#f59e0b" font-weight="600" letter-spacing="0.5">APPLIED AI &amp; SYSTEM CHOREOGRAPHY</text>
    <g transform="translate(16, 46)">
      <text class="badge" fill="#e2e8f0">
        <tspan fill="#38bdf8">■</tspan> Gemini / LLM APIs <tspan fill="#475569">·</tspan>
        <tspan fill="#f59e0b">■</tspan> Multi-Agent Orchestration <tspan fill="#475569">·</tspan>
        <tspan fill="#e879f9">■</tspan> Vector Math
      </text>
    </g>
  </g>
</svg>
