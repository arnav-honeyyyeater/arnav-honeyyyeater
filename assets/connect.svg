<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 110" width="100%" height="100%">
  <defs>
    <linearGradient id="connBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="connBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <style>
    .mono {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
  </style>

  <rect x="2" y="2" width="846" height="106" rx="10" fill="url(#connBg)" stroke="url(#connBorder)" stroke-width="1.2" />

  <g transform="translate(26, 26)">
    <!-- Header -->
    <text class="mono" x="0" y="0" font-size="11" fill="#10b981" font-weight="600" letter-spacing="1.2">
      // INITIATE_COMMUNICATION_LINK
    </text>
    <text class="sans" x="0" y="24" font-size="14.5" fill="#f8fafc" font-weight="700">
      Building an ambitious AI system or high-fidelity web product?
    </text>
    <text class="sans" x="0" y="44" font-size="12" fill="#94a3b8">
      Open for selective freelance projects, frontend engineering contracts, and technical collaborations.
    </text>
  </g>

  <!-- Mail channel capsule -->
  <g transform="translate(540, 28)">
    <rect x="0" y="0" width="278" height="54" rx="8" fill="#030712" stroke="#334155" stroke-width="1" />
    <circle cx="20" cy="27" r="4" fill="#10b981" />
    <text class="mono" x="32" y="22" font-size="9" fill="#64748b" letter-spacing="0.5">DIRECT DISPATCH MAIL</text>
    <text class="mono" x="32" y="40" font-size="12" fill="#38bdf8" font-weight="600">arnav.devworks@gmail.com</text>
  </g>
